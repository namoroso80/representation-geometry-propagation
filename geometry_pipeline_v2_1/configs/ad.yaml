  label_column: diagnosis
  positive_label: AD
  negative_label: NC
  id_column: null
  matrix_glob: "adjacency_*.csv"
  matrix_format: auto
  delimiter: null
  expected_nodes: 549
  diagonal: unit
  symmetrize: true
  psd_tolerance: 1.0e-8

paths:
