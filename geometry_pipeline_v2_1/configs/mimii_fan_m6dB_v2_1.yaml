dataset:
  name: MIMII_fan_m6dB
  label_column: diagnosis
  positive_label: ANOMALOUS
  negative_label: NORMAL
  id_column: sample_id
  matrix_glob: "adjacency_*.csv"
  matrix_format: auto
  delimiter: null
  expected_nodes: 128
  diagonal: unit
  symmetrize: true
  psd_tolerance: 1.0e-8

paths:
  data_dir: datasets/MIMII_fan_m6dB
  info_file: datasets/MIMII_fan_m6dB/info.csv
  output_root: outputs/pipeline_MIMII_fan_m6dB_v2_1

science:
  p_values: [1, 1.25, 1.5, 1.75, 2, 3, 4, 8, 16]
  reference_p: 1

cv:
  n_repeats: 20
  n_splits: 5
  inner_splits: 5
  random_state: 42

pipeline:
  stages: [classifier, spectral, decision, xai, summary]

spectral:
  n_resamples: 300
  subject_fraction: 0.8
  random_state: 42

xai:
  top_n_ranks: 20
  validation_pairs: 300
  random_state: 42
  parallel_backend: auto
  workers: 0
  autotune_pairs: 48

plotting:
  dpi: 220
